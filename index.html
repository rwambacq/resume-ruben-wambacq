<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruben Wambacq</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
  <style>
    /* ---- Theme tokens ---- dark is the default canvas */
    :root {
      --bg: #08080A;
      --surface: #111114;
      --surface-2: #18181C;
      --surface-3: #212126;
      --text: #FAFAFA;
      --text-muted: #B4B4BE;
      --text-faint: #7C7C88;
      --border: #26262C;
      --border-strong: #34343C;
      --accent: #2DD4BF;
      --accent-strong: #5EEAD4;
      --accent-soft: rgba(45, 212, 191, 0.12);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 40px rgba(0, 0, 0, 0.45);
      --glow: 0 0 0 1px rgba(45, 212, 191, 0.12), 0 0 48px rgba(45, 212, 191, 0.22);
      --scrollbar: #34343C;

      /* atmosphere */
      --atmosphere-1: rgba(45, 212, 191, 0.10);
      --atmosphere-2: rgba(56, 116, 203, 0.08);
      --grain-opacity: 0.05;

      /* motion */
      --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --reveal-duration: 0.9s;
    }

    [data-theme="light"] {
      --bg: #FBFBF9;
      --surface: #FFFFFF;
      --surface-2: #F4F4F2;
      --surface-3: #ECECE8;
      --text: #18181B;
      --text-muted: #4B5563;
      --text-faint: #6B7280;
      --border: #E7E7E4;
      --border-strong: #D8D8D2;
      --accent: #0D9488;
      --accent-strong: #0F766E;
      --accent-soft: rgba(13, 148, 136, 0.10);
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 12px 40px rgba(16, 24, 40, 0.08);
      --glow: 0 0 0 1px rgba(13, 148, 136, 0.10), 0 0 40px rgba(13, 148, 136, 0.14);
      --scrollbar: #D4D4D1;

      --atmosphere-1: rgba(13, 148, 136, 0.08);
      --atmosphere-2: rgba(56, 116, 203, 0.05);
      --grain-opacity: 0.035;
    }

    /* ---- Reset ---- */
    *, *::before, *::after { box-sizing: border-box; }

    html {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    html, body, div, span, applet, object, iframe,
    h1, h2, h3, h4, h5, h6, p, blockquote, pre,
    a, abbr, acronym, address, big, cite, code,
    del, dfn, em, img, ins, kbd, q, s, samp,
    small, strike, strong, sub, sup, tt, var,
    b, u, i, center,
    dl, dt, dd, ol, ul, li,
    fieldset, form, label, legend,
    table, caption, tbody, tfoot, thead, tr, th, td,
    article, aside, canvas, details, embed,
    figure, figcaption, footer, header, hgroup,
    menu, nav, output, ruby, section, summary,
    time, mark, audio, video {
      margin: 0;
      padding: 0;
      border: 0;
      font: inherit;
      vertical-align: baseline;
    }
    article, aside, details, figcaption, figure,
    footer, header, hgroup, menu, nav, section { display: block; }
    body {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ---- Atmosphere: fixed radial gradient field behind all content ---- */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(40% 35% at 18% 12%, var(--atmosphere-1), transparent 70%),
        radial-gradient(45% 40% at 85% 8%, var(--atmosphere-2), transparent 72%),
        radial-gradient(50% 45% at 70% 95%, var(--atmosphere-1), transparent 75%);
      filter: blur(20px);
      transition: opacity 0.4s ease;
      animation: atmosphere-drift 28s ease-in-out infinite alternate;
    }

    #app { position: relative; z-index: 1; }

    @keyframes atmosphere-drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to   { transform: translate3d(2%, -2%, 0) scale(1.08); }
    }

    ol, ul { list-style: none; }
    a { color: inherit; text-decoration: none; }

    /* ---- Lenis smooth scroll ---- */
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
    .lenis.lenis-stopped { overflow: hidden; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      body::before { animation: none; }
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    ::selection { background: var(--accent-soft); color: var(--accent-strong); }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border-radius: 1000px;
      border: 2px solid var(--bg);
    }

    /* ---- Scroll reveal (driven by the global v-reveal directive) ---- */
    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition:
        opacity var(--reveal-duration) var(--ease-cinematic),
        transform var(--reveal-duration) var(--ease-cinematic);
      transition-delay: var(--reveal-delay, 0s);
      will-change: opacity, transform;
    }
    .reveal--in {
      opacity: 1;
      transform: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }
  </style>
</html>
